name: eSIM price scrape

# Runs daily in GitHub's cloud — your Mac does NOT need to be on.
on:
  # Automatic daily run — no external service or Mac required.
  # GitHub's free scheduler can drift by up to a few hours, but it always runs
  # at least once a day. For exact 10:00 timing, an external trigger
  # (cron-job.org) can POST to workflow_dispatch instead.
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 10:00 Israel (summer) / 09:00 (winter)
  # Manual trigger (Actions tab) + external triggers (cron-job.org).
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Backstop only. Every step below carries its own limit, so the job limit
    # should never be what stops us — if it is, a step is missing a timeout.
    # It must therefore stay above the sum of those limits (6 + 8 + 68 + 6 = 88),
    # or a step gets cut by the job instead of by its own cap. Raised 75 -> 90 on
    # 2026-09-09 with the Stellar step: at 75 a slow scraper would have eaten the
    # 6 minutes the Stellar refresh needs, and 'if: always()' cannot save a step
    # from a job timeout — the job kills everything, including the run's log.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Chromium is ~170MB fetched from Microsoft's CDN. Caching it means the
      # daily run does not depend on that download being fast, or up.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # This step hung for 30 min (2026-08-19 07:31) and 90 min (2026-08-19
      # 21:05) while normally finishing in 21-28s, and on the 90-min run the
      # scraper never started at all. It does two things that can block
      # forever, so both are pinned:
      #   * apt-get, run by --with-deps under sudo. The runner image runs
      #     unattended-upgrades in the background; if it holds the dpkg lock,
      #     apt-get waits for it with no limit. DPkg::Lock::Timeout turns that
      #     endless wait into a plain error, and it goes in apt.conf because
      #     Playwright builds the apt-get command line itself.
      #   * a CDN download with no ceiling of its own.
      # timeout-minutes is the backstop under both: a hang now costs 8 minutes
      # and shows up as a FAILED step naming the cause, instead of eating the
      # whole run and reporting "cancelled".
      - name: Install Playwright Chromium + system deps
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout
          python -m playwright install --with-deps chromium \
            || python -m playwright install --with-deps chromium

      # The scraper stops itself at SCRAPE_BUDGET_MIN and saves what it has,
      # so this limit is the backstop, deliberately above the budget. A run
      # killed here would die between two saves with nothing to say what it
      # skipped — which is why the budget is the smaller number.
      # Raised 45 -> 58 on 2026-09-07, when the day search stopped asking "does
      # 30 days still work?" and started asking "which day is cheapest?". The
      # second question has to price the whole band: 530 extra page reads a run
      # across 83 rows, about 13 minutes at DAY_SCAN_CONCURRENCY 5. The step cap
      # moves with it and both still sit under the job's ceiling — 75 since
      # 2026-09-08, when the budget went to 62 and this cap to 68.
      - name: Run scraper
        timeout-minutes: 68
        env:
          # 58 -> 62 on 2026-09-08, alongside the concurrency raise above.
          # Both of that day's runs hit 58 with three rows left, so the work
          # no longer fits in the old budget even once the reads speed up.
          # This stays the SMALLER of the two limits on purpose: the budget
          # saves what it has and names what it skipped, the step cap kills
          # the run between two saves and explains nothing.
          SCRAPE_BUDGET_MIN: "62"
          # How many validities of ONE row are priced at once. Each scrape()
          # launches its own browser and shares nothing, so these are safe to
          # overlap; the runner has 2 cores, which is what keeps this off 12.
          #
          # Raised 5 -> 8 on 2026-09-08. The volume estimate above was right
          # (546 probes against the 530 predicted); the THROUGHPUT was not.
          # 546 reads were budgeted at 13 minutes and cost about 31, so a read
          # is roughly 2.4x slower than assumed - these are browser launches
          # waiting on esim.dog, not arithmetic, so the two cores are idle
          # through most of each one and a deeper queue is the lever that
          # actually moves. If 8 still does not fit, the next honest fix is to
          # stop launching a browser per probe, NOT to raise this to 20.
          DAY_SCAN_CONCURRENCY: "8"
          # The service-account JSON is stored as a repo secret, never in the code.
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python esim_price_scraper.py

      # Stellar answers its whole catalogue over an API in under a minute, so
      # its rows cost seconds where esim.dog's cost an hour of browser driving.
      # That is the entire reason this is a separate step and not more scraper work.
      #
      # It runs AFTER the scraper, and that order matters: stellar_prices.py
      # picks a Stellar listing against the days the customer is promised, and
      # the promise is whatever the esim.dog row says AFTER the scraper's
      # cheapest-day search has rewritten it. Running first would price today's
      # rows against yesterday's promise.
      #
      # always() because the scraper exits 1 when its budget cuts rows short,
      # which is a normal outcome, not a reason to leave the Stellar rows a day
      # stale. STELLAR_READ_KEY is the plans:read-only key (memory:
      # stellar-key-placement). Without it the script falls back to the public
      # RETAIL feed and estimates wholesale, and says so in this log.
      - name: Refresh Stellar prices
        if: always()
        timeout-minutes: 6
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          STELLAR_READ_KEY: ${{ secrets.STELLAR_READ_KEY }}
        run: python stellar_prices.py --apply
