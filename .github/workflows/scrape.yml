name: eSIM price scrape

# Runs daily in GitHub's cloud — your Mac does NOT need to be on.
on:
  # Automatic daily run — no external service or Mac required.
  # GitHub's free scheduler can drift by up to a few hours, but it always runs
  # at least once a day. For exact 10:00 timing, an external trigger
  # (cron-job.org) can POST to workflow_dispatch instead.
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 10:00 Israel (summer) / 09:00 (winter)
  # Manual trigger (Actions tab) + external triggers (cron-job.org).
  workflow_dispatch:

# The sheet has one set of price columns and, since 2026-09-10, two writers:
# this scrape and the 4-hourly stellar-prices.yml. They share this group so the
# light job queues behind a running scrape instead of writing the same rows at
# the same time. cancel-in-progress: false — a scrape costs an hour of browser
# driving and must never be killed to let a one-minute price refresh in.
concurrency:
  group: price-sheet
  cancel-in-progress: false

jobs:
  # The 07:00 UTC cron above was meant as the daily run, but since the sheet
  # script's dailyScrape dispatches this workflow at 10:00 Israel every day
  # the cron has been a SECOND hour-long scrape every afternoon (it drifts to
  # 12:00-15:30 UTC), holding the price-sheet group so the 4-hourly Stellar
  # refresh queued 43 minutes behind it on 2026-10-01. From 2026-10-06 the
  # cron is a backstop: it runs only when no scrape has SUCCEEDED in the last
  # 16 hours (a budget-cut run exits 1, so an incomplete morning still gets
  # its second chance). A dispatched run is never gated.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - name: Did a scrape already succeed in the last 16 hours?
        id: fresh
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '16 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api --method GET "repos/${{ github.repository }}/actions/workflows/scrape.yml/runs" \
                -f status=success -f per_page=5 -f created=">=$since" \
                --jq '.workflow_runs | length' 2>/dev/null || echo 0)
          echo "successful scrapes since $since: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A scrape already ran today - this scheduled backstop is skipped."
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Backstop only. Every step below carries its own limit, so the job limit
    # should never be what stops us — if it is, a step is missing a timeout.
    # It must therefore stay above the sum of those limits (6 + 8 + 68 + 6 + 5 =
    # 93), or a step gets cut by the job instead of by its own cap. Raised 75 ->
    # 90 on 2026-09-09 with the Stellar step and 90 -> 95 on 2026-09-10 with the
    # supplier choice: at 90 a slow scraper would have eaten the 5 minutes that
    # last step needs, and 'if: always()' cannot save a step from a job timeout —
    # the job kills everything, including the run's log. 95 -> 110 on
    # 2026-10-06 (scraper 68 -> 75, Stellar 6 -> 10: 6 + 8 + 75 + 10 + 5 = 104).
    timeout-minutes: 110
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Chromium is ~170MB fetched from Microsoft's CDN. Caching it means the
      # daily run does not depend on that download being fast, or up.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # This step hung for 30 min (2026-08-19 07:31) and 90 min (2026-08-19
      # 21:05) while normally finishing in 21-28s, and on the 90-min run the
      # scraper never started at all. It does two things that can block
      # forever, so both are pinned:
      #   * apt-get, run by --with-deps under sudo. The runner image runs
      #     unattended-upgrades in the background; if it holds the dpkg lock,
      #     apt-get waits for it with no limit. DPkg::Lock::Timeout turns that
      #     endless wait into a plain error, and it goes in apt.conf because
      #     Playwright builds the apt-get command line itself.
      #   * a CDN download with no ceiling of its own.
      # timeout-minutes is the backstop under both: a hang now costs 8 minutes
      # and shows up as a FAILED step naming the cause, instead of eating the
      # whole run and reporting "cancelled".
      - name: Install Playwright Chromium + system deps
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout
          python -m playwright install --with-deps chromium \
            || python -m playwright install --with-deps chromium

      # The scraper stops itself at SCRAPE_BUDGET_MIN and saves what it has,
      # so this limit is the backstop, deliberately above the budget. A run
      # killed here would die between two saves with nothing to say what it
      # skipped — which is why the budget is the smaller number.
      # Raised 45 -> 58 on 2026-09-07, when the day search stopped asking "does
      # 30 days still work?" and started asking "which day is cheapest?". The
      # second question has to price the whole band: 530 extra page reads a run
      # across 83 rows, about 13 minutes at DAY_SCAN_CONCURRENCY 5. The step cap
      # moves with it and both still sit under the job's ceiling — 75 since
      # 2026-09-08, when the budget went to 62 and this cap to 68.
      # 68 -> 75 on 2026-10-06: the 62-minute budget used to be checked only
      # when a package COMPLETED, and the verdict loop waits for packages in
      # row order, so one 3-minute read plus its validity scan ran the step
      # into this cap on 5 of 14 days (the last ~30 packages' prices were then
      # never flushed). The scraper now abandons an in-flight read
      # SCRAPE_GRACE_SEC after the deadline and saves; this cap only has to
      # cover budget + grace + the final flush.
      - name: Run scraper
        timeout-minutes: 75
        env:
          # Unbuffered stdout: with block buffering the last minutes before a
          # step-cap kill were lost from the log, exactly the minutes that
          # explain the kill.
          PYTHONUNBUFFERED: "1"
          # 58 -> 62 on 2026-09-08, alongside the concurrency raise above.
          # Both of that day's runs hit 58 with three rows left, so the work
          # no longer fits in the old budget even once the reads speed up.
          # This stays the SMALLER of the two limits on purpose: the budget
          # saves what it has and names what it skipped, the step cap kills
          # the run between two saves and explains nothing.
          SCRAPE_BUDGET_MIN: "62"
          # How long past the budget the run waits for a package already in
          # flight before saving without it (see the step cap above).
          SCRAPE_GRACE_SEC: "240"
          # 3 -> 4 on 2026-09-10. This is now an ORDER knob, not a cost one:
          # BROWSER_SLOTS below is what caps the actual number of Chromiums, so
          # raising this deepens the queue instead of the process count.
          SCRAPE_CONCURRENCY: "4"   # packages read at once
          # The real ceiling: how many Chromiums may be alive AT ONCE, anywhere
          # in the process. Without it these two knobs multiplied — 4 packages
          # x 8 validities is 32 browsers on a 2-core runner, a number nobody
          # chose. 6 is what the runner can actually keep busy.
          BROWSER_SLOTS: "6"
          # How many validities of ONE row are priced at once. Each scrape()
          # launches its own browser and shares nothing, so these are safe to
          # overlap; the runner has 2 cores, which is what keeps this off 12.
          #
          # Raised 5 -> 8 on 2026-09-08. The volume estimate above was right
          # (546 probes against the 530 predicted); the THROUGHPUT was not.
          # 546 reads were budgeted at 13 minutes and cost about 31, so a read
          # is roughly 2.4x slower than assumed - these are browser launches
          # waiting on esim.dog, not arithmetic, so the two cores are idle
          # through most of each one and a deeper queue is the lever that
          # actually moves. If 8 still does not fit, the next honest fix is to
          # stop launching a browser per probe, NOT to raise this to 20.
          DAY_SCAN_CONCURRENCY: "8"
          # How often a row whose own day SELLS prices the rest of its window,
          # in days (2026-10-07). The window was 84% of a run's page loads and
          # 146 of 192 scans were rows like that; with 192 rows the morning run
          # ran out of its 62 minutes two days running. A row whose day does
          # not sell is still searched on every run. "1" restores every day.
          DAY_SCAN_EVERY: "2"
          # The service-account JSON is stored as a repo secret, never in the code.
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python esim_price_scraper.py

      # Stellar answers its whole catalogue over an API in under a minute, so
      # its rows cost seconds where esim.dog's cost an hour of browser driving.
      # That is the entire reason this is a separate step and not more scraper work.
      #
      # It no longer picks its listing against the esim.dog row's days. As of
      # 2026-09-10 both suppliers answer to the SAME source of truth: the size
      # bands in day_policy.py. stellar_prices.py picks the best Stellar
      # listing inside the band for that size, the scraper's cheapest-day
      # search picks esim.dog's inside the same band, and choose_supplier.py
      # compares the two afterwards. Neither step reads the other's validity,
      # so this step's ORDER is now only about freshness - both prices have to
      # be today's before the chooser runs - and not about the days.
      #
      # always() because the scraper exits 1 when its budget cuts rows short,
      # which is a normal outcome, not a reason to leave the Stellar rows a day
      # stale. STELLAR_READ_KEY is the plans:read-only key (memory:
      # stellar-key-placement). Without it the script will not write anything:
      # its only remaining source is the public RETAIL feed, and it refuses to
      # write estimates off it - it says so in this log and exits 3.
      # 6 -> 10 on 2026-10-06: since ad65d36 reads the WHOLE catalogue (7,000+
      # listings, 70+ pages at Stellar's 55-a-minute pace) the step takes
      # 90-290 s; the 10-04 22:54 run was killed one tick after its last write.
      - name: Refresh Stellar prices
        id: stellar
        if: always()
        timeout-minutes: 10
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          STELLAR_READ_KEY: ${{ secrets.STELLAR_READ_KEY }}
        run: python stellar_prices.py --apply

      # The sheet now carries two priced rows per SKU — esim.dog's and
      # Stellar's — and the tick in 'נבחר' is what the site sells from. Neither
      # step above writes it: the scraper only knows esim.dog's prices and the
      # Stellar refresh only knows Stellar's, so the comparison has to happen
      # after both of them have written. Running it any earlier would choose a
      # supplier from one fresh price and one that is a day old.
      #
      # It runs only if the Stellar step SUCCEEDED, and that is the whole
      # condition worth reading twice. stellar_prices.py exits 3 on 'no
      # wholesale key / estimate refused': with no way to read the real
      # wholesale price it would have to ESTIMATE Stellar's cost off the public
      # retail feed, and it refuses to write those estimates. They are ~1.22x
      # off (memory: stellar-vs-esimdog-list-price) and they would go into the
      # very column a real price goes in - so a chooser running behind them
      # would compare esim.dog's real cost against a guess, and move live SKUs
      # on it. Exit 3 leaves yesterday's Stellar prices in place instead, and
      # this gate keeps the chooser off them.
      # A failed Stellar step means the same thing: yesterday's Stellar prices
      # against today's esim.dog ones. Neither is a comparison; both are
      # skipped, and the ticks simply stay where the owner last had them.
      #
      # always() && ... , not a bare condition: an `if` with no status function
      # is implicitly wrapped in success(), and the scraper exits 1 whenever its
      # budget cuts rows short - a NORMAL outcome (memory:
      # scrape-workflow-budget). A bare condition would therefore skip this step
      # on most days, which is the opposite of what the Stellar gate is for.
      # always() keeps the scraper's exit code out of it; steps.stellar.outcome
      # is the only thing that decides.
      - name: Choose supplier
        if: always() && steps.stellar.outcome == 'success'
        timeout-minutes: 5
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          # The off-sale alert (choose_supplier.mail_live_q_changes); missing = log line only.
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python choose_supplier.py --apply
