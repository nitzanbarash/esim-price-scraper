name: Package usage (every 4h)

# Bot #5: refreshes how much data each LIVE package has used — receipts sheet
# + the customer's order page — and retires packages that are finished.
# Only rows whose Status column is still active are checked, and the supplier
# is asked about 50 of them per request, so this stays cheap as the number of
# customers grows.
on:
  schedule:
    # Every 4 hours, keeping the old 09:00 Israel slot as one of them. A meter
    # a customer watches should not be a day stale. This costs nothing: the
    # repo is public, so Actions minutes are free and unmetered, and the
    # supplier is asked in batches of 50 — six runs a day is a rounding error
    # to it.
    - cron: "0 2,6,10,14,18,22 * * *"   # 05,09,13,17,21,01 Israel
  workflow_dispatch:
    inputs:
      force:
        description: "Run even though the network is up"
        type: boolean
        default: false

concurrency:
  group: usage
  cancel-in-progress: false

jobs:
  # GitHub is the update network's BACKUP (owner, 2026-11-12): the PCs run
  # this job themselves, so it goes ahead here only while the network is not
  # reporting (net_gate.sh). 'force' from the Actions tab runs it anyway.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      skip: ${{ steps.net.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: net_gate.sh
          sparse-checkout-cone-mode: false
      - name: Is the update network up?
        id: net
        env:
          ORDERS_TOKEN: ${{ secrets.ORDERS_TOKEN }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        run: bash net_gate.sh

  usage:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30       # room for thousands of packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -q gspread requests

      - name: Update package usage
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ORDERS_TOKEN: ${{ secrets.ORDERS_TOKEN }}
          # The second supplier. Stellar has no batch usage endpoint and no
          # ICCID, so those rows are read one portal order at a time
          # (stellar_usage.py). Absent or wrong, every Stellar row is left
          # exactly as it was — nothing is retired on a missing key.
          STELLAR_API_KEY: ${{ secrets.STELLAR_API_KEY }}
        run: python usage_bot.py

      # The receipts sheet's colour rules (supplier word colour in
      # 'מקור - source', paid/discount/free fill in 'מכירה - Sell', the
      # grey/green/yellow/red/blue usage bands in 'GB (0/X) - ניצול'). Writes
      # nothing when they are already in place; a supplier added to the
      # dropdown gets its colour here. Never allowed to fail the usage run.
      - name: Receipts colours
        if: always()
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python receipts_colors.py
