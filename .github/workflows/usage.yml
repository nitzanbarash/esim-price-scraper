name: Package usage (every 4h)

# Bot #5: refreshes how much data each LIVE package has used — receipts sheet
# + the customer's order page — and retires packages that are finished.
# Only rows whose Status column is still active are checked, and the supplier
# is asked about 50 of them per request, so this stays cheap as the number of
# customers grows.
on:
  schedule:
    # Every 4 hours, keeping the old 09:00 Israel slot as one of them. A meter
    # a customer watches should not be a day stale. This costs nothing: the
    # repo is public, so Actions minutes are free and unmetered, and the
    # supplier is asked in batches of 50 — six runs a day is a rounding error
    # to it.
    - cron: "0 2,6,10,14,18,22 * * *"   # 05,09,13,17,21,01 Israel
  workflow_dispatch: {}       # run it now from the Actions tab

concurrency:
  group: usage
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # room for thousands of packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -q gspread requests

      - name: Update package usage
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ORDERS_TOKEN: ${{ secrets.ORDERS_TOKEN }}
        run: python usage_bot.py
