name: Tests

# The bots run unattended against a supplier we do not control, and a crash in
# one of them is invisible until a customer notices. These tests pin the
# decisions that must survive whatever the supplier sends — run on every push,
# so a break is caught here rather than by a frozen usage meter days later.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The scraper module imports playwright and the Google client at module
      # level, so the route-policy test needs them present to import it. Only
      # the LIBRARIES are installed — no browser download, nothing is launched.
      - name: Install dependencies
        run: pip install -q gspread requests playwright google-auth google-api-python-client

      # No secrets: every test is offline, with the supplier's real payload
      # shapes faked in. Nothing here touches the sheet, the site or a customer.
      - name: Usage bot
        run: python test_usage_bot.py

      # Which route goes in the sheet is which route the purchase bot buys, so
      # a regression here is sold to a customer before anyone sees it.
      - name: Route policy
        run: python test_route_policy.py

      # Which DAYS the sheet sells is which package the purchase bot buys and
      # which validity the customer is promised. This search rewrites the link
      # itself, so a regression here changes an order rather than a report.
      - name: Price fallback
        run: python test_price_fallback.py

      # The books decide what the business believes it earned. The money logic
      # is pure, so there is no excuse for finding out it is wrong from a
      # nightly run that already wrote the numbers down.
      - name: Finance core
        run: python -m unittest test_finance_core -v

      # Which SUPPLIER row the books read. One SKU carries a row per supplier,
      # stacked, and only the row we buy from holds our sell price — keying by
      # SKU alone let the Stellar row underneath blank out 57 packages' list
      # price and report a discount of zero on 21 real sales.
      - name: Finance price rows
        run: python test_finance_prices.py

      # Which Stellar LISTING each row is priced from. A package code is a
      # family spanning several GB and day counts, so the wrong pick sells the
      # customer fewer days than the sheet promises — and the price string is
      # only true while its cell carries a left-to-right direction.
      - name: Stellar prices
        run: python test_stellar_prices.py

      # Which Stellar order is placed, under which idempotency key, what the
      # site is handed back -- and when NOTHING is bought. The one write in
      # this repo that spends money.
      - name: Stellar buyer
        run: python test_stellar_buyer.py

      # A duplicate eSIM email is money and trust, both already spent.
      - name: Delivery dedup
        run: python test_delivery_dedup.py

      # Which VALIDITY each size is sold at. The owner's day rules (2026-09-10)
      # are the difference between 30 days and 25 for a few agorot, and between
      # a Stellar 60-day plan taken for free and one bought by mistake — the
      # customer is promised the number of days the sheet carries.
      - name: Day policy
        run: python test_day_policy.py

      # The Stellar meter: /esims/{sim_id}/usage, and the VPN expiry never
      # becomes the package expiry.
      - name: Stellar usage
        run: python test_stellar_usage.py

      # Which SUPPLIER a row is bought from. Two rows sit under one SKU and only
      # one of them is the one we pay; picking the wrong one spends money at the
      # wrong place under the right price.
      - name: Choose supplier
        run: python test_choose_supplier.py

      # What a coupon row MEANS before it is pushed to the till. A blank 'active'
      # cell that read as true, or a percent-formatted 10 that read as 0.1, is a
      # discount nobody approved being handed to everyone who asks.
      - name: Coupon sync
        run: python test_coupon_sync.py
