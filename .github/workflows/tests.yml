name: Tests

# The bots run unattended against a supplier we do not control, and a crash in
# one of them is invisible until a customer notices. These tests pin the
# decisions that must survive whatever the supplier sends — run on every push,
# so a break is caught here rather than by a frozen usage meter days later.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The scraper module imports playwright and the Google client at module
      # level, so the route-policy test needs them present to import it. Only
      # the LIBRARIES are installed — no browser download, nothing is launched.
      - name: Install dependencies
        run: pip install -q gspread requests playwright google-auth google-api-python-client

      # No secrets: every test is offline, with the supplier's real payload
      # shapes faked in. Nothing here touches the sheet, the site or a customer.
      - name: Usage bot
        run: python test_usage_bot.py

      # Which route goes in the sheet is which route the purchase bot buys, so
      # a regression here is sold to a customer before anyone sees it.
      - name: Route policy
        run: python test_route_policy.py

      # Which DAYS the sheet sells is which package the purchase bot buys and
      # which validity the customer is promised. This search rewrites the link
      # itself, so a regression here changes an order rather than a report.
      - name: Price fallback
        run: python test_price_fallback.py

      # The books decide what the business believes it earned. The money logic
      # is pure, so there is no excuse for finding out it is wrong from a
      # nightly run that already wrote the numbers down.
      - name: Finance core
        run: python -m unittest test_finance_core -v
