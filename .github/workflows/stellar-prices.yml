# Stellar rows added to the sheet between daily scrapes sit priceless until the
# next 10:00 run; the owner asked for ~4h freshness on 2026-09-10.
name: Stellar prices (every 4h)

# Stellar answers its whole catalogue over an API in about a minute, so unlike
# the esim.dog browser scrape there is no reason to pay for it only once a day.
# This job is the same two steps scrape.yml ends with, on their own light
# schedule. scrape.yml KEEPS its own copies: after a scrape both prices must be
# today's before the chooser compares them, and that ordering is the whole
# reason those steps live inside that run.
on:
  schedule:
    - cron: "0 */4 * * *"
  # Since 2026-11-16 a BACKUP for the update network, like scrape.yml and
  # usage.yml: the PCs run stellar_prices every hour, and this run used to
  # land after them and stamp all the s2 rows "git" - the owner read that as
  # "the servers do not update the sheet". 'force' runs it anyway.
  # It stands back only while the network's OWN stellar_prices and chooser
  # jobs have succeeded within 2 hours (net_gate.sh NEED_JOB): "the network
  # is reporting" alone is not enough, since stellar_prices runs only on a
  # computer whose vault holds a Stellar key - with none, or in shadow, or
  # failing every run, the network reports "ok" and nobody prices s2.
  workflow_dispatch:
    inputs:
      force:
        description: "Run even though the network is up"
        type: boolean
        default: false

# The sheet has one set of price columns and two writers. Sharing a group with
# scrape.yml means a 4-hourly run that lands mid-scrape QUEUES behind it rather
# than writing the same rows at the same time; cancel-in-progress: false because
# the scrape must never be killed by this cheap job, and a queued price refresh
# is worth running late.
concurrency:
  group: price-sheet
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      # Both of this run's jobs must be done by the network for it to stand
      # back: the chooser below is the only GitHub chooser outside the daily
      # scrape (which the network's scraping skips), so a network chooser that
      # stopped would otherwise have no backup at all.
      skip: ${{ steps.net.outputs.skip == 'true' && steps.chooser.outputs.skip == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: net_gate.sh
          sparse-checkout-cone-mode: false
      # 7200: the network runs it hourly (+0-10 min), so two hours is one
      # missed run and a late one - not a single slow tick.
      - name: Is the network refreshing the s2 prices?
        id: net
        timeout-minutes: 2
        env:
          ORDERS_TOKEN: ${{ secrets.ORDERS_TOKEN }}
          NEED_JOB: stellar_prices
          MAX_JOB_AGE_S: "7200"
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        run: bash net_gate.sh
      - name: Is the network choosing the supplier?
        id: chooser
        timeout-minutes: 2
        env:
          ORDERS_TOKEN: ${{ secrets.ORDERS_TOKEN }}
          NEED_JOB: chooser
          MAX_JOB_AGE_S: "7200"
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        run: bash net_gate.sh

  prices:
    needs: gate
    # !cancelled(): a bare condition is wrapped in success(), so a gate that
    # FAILED (checkout down, a runner fault) skipped the backup - the one
    # moment it cannot tell is the moment it must run.
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # Backstop only — the steps below cap themselves at 6 (pip) + 10 (Stellar,
    # 5 -> 10 on 2026-10-06) + 5 (chooser) = 21, and checkout/python is
    # another minute. 15 -> 25 on 2026-11-16: at 15 a slow pip and a slow
    # Stellar read let the JOB cut the chooser instead of its own cap.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STELLAR_READ_KEY is the plans:read-only key (memory:
      # stellar-key-placement). Without it the script will not write anything:
      # its only remaining source is the public RETAIL feed, and it refuses to
      # write estimates off it — it says so in this log and exits 3.
      # 5 -> 10 on 2026-10-06: the whole-catalogue read (ad65d36) takes 90-290 s
      # and the 10-04 22:54 run was killed one tick after its last write.
      - name: Refresh Stellar prices
        id: stellar
        timeout-minutes: 10
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          STELLAR_READ_KEY: ${{ secrets.STELLAR_READ_KEY }}
        run: python stellar_prices.py --apply

      # Same gate as scrape.yml, and for the same reason: stellar_prices.py
      # exits 3 on 'no wholesale key / estimate refused', and a chooser running
      # behind that would compare esim.dog's real cost against a guess and move
      # live SKUs on it. A failed step means the same thing. Both are skipped
      # and the ticks stay where the owner last had them.
      - name: Choose supplier
        if: always() && steps.stellar.outcome == 'success'
        timeout-minutes: 5
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          # Price moves + off/on-sale go to the owner's daily summary (site fn=price_log);
          # the mail (GMAIL_APP_PASSWORD) is only the fallback when the site refuses.
          ORDERS_TOKEN: ${{ secrets.ORDERS_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python choose_supplier.py --apply
