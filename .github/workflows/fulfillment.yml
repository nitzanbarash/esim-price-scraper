name: Order fulfillment (delivery emails)

# Bot #4: completes orders from esim.dog delivery emails — receipts sheet +
# waverole.com order page. Stateless: processed emails are IMAP-flagged.
#
# 2026-09-13: the Stellar purchase moved to its own workflow, stellar-buy.yml,
# which the site wakes the moment an order is paid. This tick is only its
# backstop: when a Stellar order is still pending at tick time, the step
# below wakes that workflow. Only stellar-buy.yml may ever buy from Stellar —
# two buyers would share the claim worker name and could buy twice.
on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes (public repo — free)
  workflow_dispatch: {}       # manual run from the Actions tab; the sheet script ticks this

permissions:
  contents: read
  actions: write              # the backstop step dispatches stellar-buy.yml

concurrency:
  group: fulfillment
  cancel-in-progress: false

jobs:
  fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # No browser any more: the bot reads the supplier's JSON endpoint
      # directly, which cut this job from ~2 minutes to a few seconds.
      - name: Install dependencies
        run: pip install -q gspread requests playwright google-auth google-api-python-client

      # Backstop for a lost order-paid dispatch (token missing, GitHub
      # answered 404, the run cancelled behind another): if a Stellar order
      # is still pending, wake stellar-buy.yml. Only a COUNT is printed —
      # the orders JSON carries customer addresses and this repo is public.
      - name: Wake the Stellar buyer if an order waits
        continue-on-error: true
        env:
          ORDERS_TOKEN: ${{ secrets.ORDERS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DISPATCH_URL: https://api.github.com/repos/${{ github.repository }}/actions/workflows/stellar-buy.yml/dispatches
        run: |
          n=$(curl -sf -H "Authorization: Bearer $ORDERS_TOKEN" \
                "https://www.waverole.com/api/orders?status=pending&supplier=stellar" \
              | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("orders") or []))' 2>/dev/null || echo 0)
          echo "pending Stellar orders: $n"
          if [ "${n:-0}" -gt 0 ]; then
            curl -sf -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$DISPATCH_URL" -d '{"ref":"main"}' && echo "stellar-buy.yml dispatched"
          fi

      - name: Run fulfillment bot
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ORDERS_TOKEN: ${{ secrets.ORDERS_TOKEN }}
        run: python fulfillment_bot.py
